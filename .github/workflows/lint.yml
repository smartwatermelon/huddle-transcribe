name: Lint

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the checked-out credential would
          # otherwise persist in .git/config for later steps to reach.
          persist-credentials: false

      # Pin both tools to the versions used in local dev rather than taking
      # whatever apt ships. ubuntu's shellcheck lags several releases and
      # disagrees with newer ones on which checks fire, which would let CI
      # pass on a script that fails locally (or the reverse). Checksums are
      # verified so a moved tag cannot swap the binary.
      - name: Install ShellCheck v0.11.0
        run: |
          curl -Lfso /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          expected_sha256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          echo "${expected_sha256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: 0.11.0"

      - name: Install shfmt v3.14.0
        run: |
          curl -Lfso /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          expected_sha256="fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66"
          echo "${expected_sha256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version | grep -q "v3.14.0"

      # Discover the shell scripts to check instead of listing them here.
      # A hardcoded list silently omits any script added later: the new file
      # ships unlinted, with an unchecked exec bit, and CI still reports
      # green. Discovery is by shebang over git-tracked files, so a new
      # script is covered the moment it is committed.
      - name: Discover shell scripts
        id: scripts
        run: |
          # Files that are tracked executable but deliberately not shell.
          # Anything mode-755 and absent from both this list and the
          # discovered list fails the coverage assertion below.
          NON_SHELL_EXECUTABLES=""

          scripts=""
          while IFS= read -r -d '' f; do
            # Read only the first line, and only of regular files: a binary
            # or a symlink to one would otherwise reach the parser.
            [ -f "$f" ] || continue
            # tr -d '\r' so a CRLF file is not read as interpreter "bash\r".
            line=$(head -n 1 "$f" | tr -d '\r')
            case "$line" in '#!'*) ;; *) continue ;; esac

            # Resolve the interpreter by parsing, not by substring match.
            # The old regex tested the whole shebang line for `/sh` or
            # `/bash` anywhere in it, so `#!/usr/bin/awk -f /bin/sh` was
            # discovered as a shell script and handed to shellcheck.
            # Take the first whitespace-delimited token after `#!`, then
            # its basename -- that is the interpreter the kernel execs.
            rest=${line#'#!'}
            rest=${rest#"${rest%%[![:space:]]*}"}
            interp=${rest%%[[:space:]]*}
            args=${rest#"$interp"}
            base=${interp##*/}

            # `env` execs its first non-option argument, so the real
            # interpreter is that, not `env`. Covers `#!/usr/bin/env bash`
            # and `#!/usr/bin/env -S bash -euo pipefail` alike.
            if [ "$base" = env ]; then
              args=${args#"${args%%[![:space:]]*}"}
              while [ "${args#-}" != "$args" ]; do
                tok=${args%%[[:space:]]*}
                args=${args#"$tok"}
                args=${args#"${args%%[![:space:]]*}"}
              done
              base=${args%%[[:space:]]*}
              base=${base##*/}
            fi

            case "$base" in sh | bash) ;; *) continue ;; esac

            # The list is carried as a space-separated string through
            # GITHUB_OUTPUT, so a path containing whitespace would split
            # into two bogus entries. Fail loudly instead of silently
            # checking the wrong filenames.
            case "$f" in
              *[[:space:]]*)
                echo "::error file=$f::script paths must not contain whitespace" >&2
                exit 1
                ;;
            esac
            scripts="${scripts:+$scripts }$f"
          done < <(git ls-files -z)

          if [ -z "$scripts" ]; then
            echo "::error::no shell scripts discovered; the shebang filter is broken" >&2
            exit 1
          fi

          # Coverage assertion. Discovery failing open is the whole risk of
          # discovering rather than listing: a script whose shebang this
          # parser does not recognise ships unlinted and CI still reports
          # green. Assert instead that every tracked executable is either
          # discovered or named above as deliberately not shell, so the
          # failure mode is a red build rather than silence.
          #
          # Read the mode listing with `-sz`, not `-s`. Plain `git ls-files
          # -s` C-quotes any path with a non-ASCII byte or a quote in it
          # (`"w\303\251ird.sh"`) while the `-z` form above does not, so the
          # two sides of this comparison would spell the same path
          # differently: a perfectly good `wéird.sh` is discovered and
          # linted, then flagged here as uncovered. A false positive on the
          # check whose whole job is to be trusted is how the check gets
          # weakened. `-sz` quotes nothing, and splitting on the tab keeps
          # runs of spaces and embedded tabs intact -- awk's field rebuild
          # collapsed them.
          rc=0
          tab=$'\t'
          while IFS= read -r -d '' entry; do
            case "$entry" in '100755 '*) ;; *) continue ;; esac
            # `<mode> <sha> <stage>\t<path>` -- everything after the first
            # tab is the path, spaces and all.
            exe=${entry#*"$tab"}
            [ -n "$exe" ] || continue
            case " $scripts " in *" $exe "*) continue ;; esac
            if [ -n "$NON_SHELL_EXECUTABLES" ]; then
              case " $NON_SHELL_EXECUTABLES " in *" $exe "*) continue ;; esac
            fi
            echo "::error file=$exe::tracked executable not covered by shell discovery; give it a sh/bash shebang or add it to NON_SHELL_EXECUTABLES in this step" >&2
            rc=1
          done < <(git ls-files -sz)
          [ "$rc" -eq 0 ] || exit "$rc"

          echo "Discovered: $scripts"
          echo "list=$scripts" >> "$GITHUB_OUTPUT"

      # Every step below takes the discovered list through `env:` rather than
      # a `${{ }}` expansion inside `run:`. Template expansion happens before
      # the shell parses the script, so a crafted filename in an expanded
      # list would be spliced in as code; via env it arrives as data.
      # The list is read into an array and expanded quoted, so no step needs
      # a `# shellcheck disable` for word splitting -- which matters, since
      # one of these steps rejects exactly that directive.

      # -S info, not the default: the project standard is a clean run at
      # info severity with no `# shellcheck disable` directives anywhere.
      - name: ShellCheck
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          read -r -a scripts <<<"$SCRIPTS"
          shellcheck -S info "${scripts[@]}"

      # -i 2 -ci is the repo's format. Bare `shfmt` defaults to tabs and
      # would report the entire file as unformatted.
      - name: shfmt
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          read -r -a scripts <<<"$SCRIPTS"
          shfmt -i 2 -ci -d "${scripts[@]}"

      # Assert no `# shellcheck disable` directive has crept in. The project
      # standard is to fix the finding, not silence it, and a directive is
      # invisible to a green shellcheck run by construction.
      #
      # No `-r`: every entry is a regular file, and if one were ever a
      # directory `-r` would silently widen the check to its whole tree.
      # Anchored to a real directive -- comment start, `shellcheck`,
      # `disable` -- so prose that merely names the directive (this repo's
      # own docs and error strings do) is not a false failure, while
      # `#shellcheck disable` and `#   shellcheck   disable` still are.
      - name: Check for shellcheck disable directives
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          read -r -a scripts <<<"$SCRIPTS"
          if grep -nE '^[[:space:]]*#[[:space:]]*shellcheck[[:space:]]+disable' "${scripts[@]}"; then
            echo "::error::no '# shellcheck disable' directives are permitted; fix the finding instead" >&2
            exit 1
          fi

      # The scripts are the deliverable and are installed by symlink, so a
      # lost exec bit breaks a fresh clone in a way nothing else here
      # catches. tests/ is excluded: the suite is invoked as ./run-tests.sh
      # but a lost bit there fails the sanity job loudly anyway.
      - name: Check executable bit
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          rc=0
          read -r -a scripts <<<"$SCRIPTS"
          for script in "${scripts[@]}"; do
            case "$script" in tests/*) continue ;; esac
            if [ ! -x "$script" ]; then
              echo "::error file=$script::$script must be executable (git update-index --chmod=+x $script)" >&2
              rc=1
            fi
          done
          exit "$rc"

      # --help must work for every top-level script: it is the one path a
      # user hits before anything else, and it runs no privileged action.
      #
      # This step executes repo code, so it states the contract it relies on
      # rather than assuming it. `--help` must print usage and exit, and
      # must do so BEFORE any dependency check, any config read, any network
      # or filesystem write, and any prompt. Every guard here enforces one
      # half of that:
      #   - `timeout 10` fails a script that blocks on a prompt or a hang
      #     instead of stalling the job until the 6h runner limit.
      #   - `HOME` points at an empty scratch dir, so a script that reads or
      #     creates `~/.config/...` on the help path is caught here rather
      #     than silently depending on runner state. Nothing outside that
      #     dir is written, and it is removed after each script.
      #   - stdin is `/dev/null`, so a read(1) gets EOF rather than hanging.
      # A failure here means the script did work on the help path, not that
      # these guards are too strict -- move the work below the help exit.
      - name: Check --help runs
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          rc=0
          read -r -a scripts <<<"$SCRIPTS"
          for script in "${scripts[@]}"; do
            case "$script" in tests/*) continue ;; esac
            fake_home=$(mktemp -d)
            # Capture the status directly. Inside `if ! cmd; then`, `$?` is
            # the negation's 0/1, not the command's code, so 124 would never
            # be distinguishable from an ordinary failure.
            status=0
            timeout 10 env HOME="$fake_home" "./$script" --help >/dev/null </dev/null || status=$?
            if [ "$status" -ne 0 ]; then
              if [ "$status" -eq 124 ]; then
                echo "::error file=$script::./$script --help timed out after 10s; --help must print usage and exit without blocking" >&2
              else
                echo "::error file=$script::./$script --help exited $status" >&2
              fi
              rc=1
            fi
            rm -rf "$fake_home"
          done
          exit "$rc"
